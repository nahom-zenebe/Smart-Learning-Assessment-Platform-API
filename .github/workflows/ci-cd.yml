name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate Python and Docker
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirement.txt

      - name: Install dependencies
        run: python -m pip install -r requirement.txt

      - name: Compile Python modules
        run: python -m compileall -q app core db models repositories router services webhooks config.py

      - name: Import application
        run: python -c "from app.main import app; assert app.title"

      - name: Install test dependencies
        run: python -m pip install -r requirement-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Validate Compose configuration
        run: JWT_SECRET=ci-only-secret docker compose config

      - name: Build Docker image
        run: docker build --tag smart-learning-api:ci .

  publish:
    name: Publish image
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
